[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-doctor"
version = "0.1.0"
description = "Find duplicate and dead links in an exported browser bookmarks file"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "alan-cinder"}]

[project.scripts]
bookmark-doctor = "bookmark_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
